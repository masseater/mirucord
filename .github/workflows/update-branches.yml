name: update-branches

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: masseater/typescript-template/.github/actions/update-branches@85e63634a051e4813f379fd082e40f4e65bdcb27

  ci-telemetry:
    needs: [update]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: masseater/typescript-template/.github/actions/ci-telemetry@85e63634a051e4813f379fd082e40f4e65bdcb27
        with:
          github-token: ${{ github.token }}
