name: update-branches

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: masseater/typescript-template/.github/actions/update-branches@8d4f43b0f80f90cdd7fdf26a8a6f7e92bac29fb1

  ci-telemetry:
    needs: [update]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: masseater/typescript-template/.github/actions/ci-telemetry@8d4f43b0f80f90cdd7fdf26a8a6f7e92bac29fb1
        with:
          github-token: ${{ github.token }}
