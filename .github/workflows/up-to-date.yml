name: up-to-date

on:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  up-to-date:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - id: changed
        if: github.event_name == 'pull_request'
        uses: masseater/typescript-template/.github/actions/pr-changed@d31880940798de1570171b0bd255ec9e69005d83
        with:
          file: skills-lock.json
          github-token: ${{ github.token }}
      - if: steps.changed.outputs.changed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.changed.outputs.changed == 'true'
        uses: masseater/typescript-template/.github/actions/skills-lock@d31880940798de1570171b0bd255ec9e69005d83
        with:
          branch: ${{ github.head_ref }}
