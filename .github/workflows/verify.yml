name: verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

env:
  TAKUMI_GUARD_TOKEN: ${{ secrets.TAKUMI_GUARD_TOKEN }}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - uses: masseater/typescript-template/.github/actions/verify@c116d175574f2f6917e2aa39caf83a141ef4bd94
        with:
          github-token: ${{ github.token }}

  autofix:
    needs: verify
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          FAILED_RUN_ID: ${{ github.run_id }}
        run: >-
          gh workflow run autofix.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_BRANCH"
          -f run_id="$FAILED_RUN_ID" -f branch="$HEAD_BRANCH" -f sha="$HEAD_SHA"

  deploy:
    needs: verify
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && github.repository == 'masseater/mirucord'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      id-token: write
      contents: read
    env:
      FLY_ENABLED: ${{ secrets.FLY_API_TOKEN != '' }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - id: head
        uses: masseater/typescript-template/.github/actions/latest-verified@c116d175574f2f6917e2aa39caf83a141ef4bd94
        with:
          github-token: ${{ github.token }}
      - if: steps.head.outputs.latest == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.head.outputs.latest == 'true'
        uses: $/.github/actions/setup
      - if: steps.head.outputs.latest == 'true'
        uses: masseater/typescript-template/.github/actions/credentials@c116d175574f2f6917e2aa39caf83a141ef4bd94
      - if: steps.head.outputs.latest == 'true'
        run: vp run -r --log labeled deploy:production
        env:
          DISCORD_CLIENT_ID: ${{ vars.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          MAX_GUILDS: ${{ vars.MAX_GUILDS }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  release:
    needs: verify
    if: github.repository == 'masseater/typescript-template'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    concurrency:
      group: release
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .github/release-please/config.json
          manifest-file: .github/release-please/manifest.json
          skip-github-pull-request: true
      - if: github.event_name == 'workflow_dispatch'
        uses: masseater/typescript-template/.github/actions/credentials@c116d175574f2f6917e2aa39caf83a141ef4bd94
      - if: github.event_name == 'workflow_dispatch'
        id: release-pr
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ env.GITHUB_APP_TOKEN }}
          config-file: .github/release-please/config.json
          manifest-file: .github/release-please/manifest.json
          skip-github-release: true
      - if: steps.release-pr.outputs.pr
        env:
          GH_TOKEN: ${{ env.GITHUB_APP_TOKEN }}
          PR: ${{ steps.release-pr.outputs.pr }}
        run: gh pr merge "$(jq -r .number <<<"$PR")" --repo "$GITHUB_REPOSITORY" --squash --auto

  ci-telemetry:
    needs: [verify, autofix, deploy, release]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: masseater/typescript-template/.github/actions/ci-telemetry@c116d175574f2f6917e2aa39caf83a141ef4bd94
        with:
          github-token: ${{ github.token }}
