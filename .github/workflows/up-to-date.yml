name: up-to-date

on:
  pull_request:
    types:
      [opened, synchronize, reopened, ready_for_review, auto_merge_enabled, auto_merge_disabled]
  workflow_dispatch:

permissions: {}

jobs:
  up-to-date:
    runs-on: ubuntu-latest
    steps:
      - uses: masseater/typescript-template/.github/actions/auto-merge-gate@85e63634a051e4813f379fd082e40f4e65bdcb27

  wake:
    needs: [up-to-date]
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.auto_merge
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run update-branches.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"
